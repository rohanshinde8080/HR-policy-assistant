<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to AI-Powered HR Policy Assistant"
    >

    <title>
        Login | HR Policy Assistant
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-icon">
                AI
            </span>

            <span>
                HR Policy Assistant
            </span>

        </a>

    </header>



    <!-- ================= LOGIN SECTION ================= -->

    <main class="auth-section">

        <div class="auth-card">


            <!-- ================= AI ICON ================= -->

            <div class="auth-icon">
                AI
            </div>



            <!-- ================= HEADING ================= -->

            <h1>
                Welcome back
            </h1>


            <p class="auth-subtitle">
                Login to access your HR Policy Assistant
            </p>



            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">


                <!-- ================= EMAIL ================= -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- ================= PASSWORD ================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- ================= LOGIN BUTTON ================= -->

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-btn login-btn"
                >

                    Login

                    <span>
                        →
                    </span>

                </button>


            </form>



            <!-- ================= LOGIN MESSAGE ================= -->

            <div
                id="loginMessage"
                class="auth-message"
            ></div>



            <!-- ================= REGISTER LINK ================= -->

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>


</body>

</html>
