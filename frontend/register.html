<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Employee Registration - HR Policy Assistant">
    <title>Register | HR Policy Assistant</title>
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-wrapper">

        <!-- ANIMATED BACKGROUND GLOW BLOBS -->
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>

        <!-- TOP BRAND LOGO -->
        <a href="index.html" class="auth-nav-logo">
            <div class="logo-icon">AI</div>
            <div>
                <span class="logo-title">HR Policy Assistant</span>
                <span class="logo-sub">Enterprise AI Portal</span>
            </div>
        </a>

        <!-- REGISTER CARD (ZERO SCROLL COMPACT) -->
        <div class="auth-card-container register-card-custom">
            <div class="auth-card">

                <!-- BADGE -->
                <div class="auth-pill-badge">
                    <span class="sparkle">🚀</span> Employee Onboarding
                </div>

                <!-- HEADER -->
                <div class="auth-header">
                    <h1>Create your account</h1>
                    <p>Get instant answers to all company HR policies</p>
                </div>

                <!-- REGISTER FORM -->
                <form id="registerForm" class="auth-form">

                    <!-- FULL NAME INPUT -->
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="auth-input"
                                placeholder="e.g. Rohan Shinde"
                                autocomplete="name"
                                required
                            >
                        </div>
                    </div>

                    <!-- EMAIL INPUT -->
                    <div class="form-group">
                        <label for="email">Work Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="auth-input"
                                placeholder="name@company.com"
                                autocomplete="email"
                                required
                            >
                        </div>
                    </div>

                    <!-- PASSWORD INPUT -->
                    <div class="form-group">
                        <label for="password">Password (min 6 characters)</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="auth-input"
                                placeholder="••••••••"
                                minlength="6"
                                required
                            >
                            <button
                                type="button"
                                class="password-toggle-btn"
                                id="togglePasswordBtn1"
                                title="Toggle Password"
                            >
                                👁️
                            </button>
                        </div>
                    </div>

                    <!-- CONFIRM PASSWORD INPUT -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔑</span>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="auth-input"
                                placeholder="••••••••"
                                minlength="6"
                                required
                            >
                            <button
                                type="button"
                                class="password-toggle-btn"
                                id="togglePasswordBtn2"
                                title="Toggle Confirm Password"
                            >
                                👁️
                            </button>
                        </div>
                    </div>

                    <!-- STATUS MESSAGE -->
                    <div id="registerMessage" class="register-message"></div>

                    <!-- REGISTER SUBMIT BUTTON -->
                    <button
                        type="submit"
                        id="registerButton"
                        class="auth-submit-btn"
                    >
                        <span>Create Account</span>
                        <span class="arrow-icon">→</span>
                    </button>

                </form>

                <!-- LOGIN FOOTER LINK -->
                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>

            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="js/config.js"></script>
    <script src="js/register.js"></script>
    <script>
        // Password Visibility Toggles
        function setupToggle(btnId, inputId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (btn && input) {
                btn.addEventListener("click", function() {
                    const isPassword = input.getAttribute("type") === "password";
                    input.setAttribute("type", isPassword ? "text" : "password");
                    btn.textContent = isPassword ? "🙈" : "👁️";
                });
            }
        }
        setupToggle("togglePasswordBtn1", "password");
        setupToggle("togglePasswordBtn2", "confirmPassword");
    </script>

</body>

</html>
